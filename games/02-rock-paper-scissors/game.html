<!DOCTYPE html>
<html>
    <head>
        <title>Rock paper scissors</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <h1>Rock Paper Scissors</h1>

        <button onclick="playGame('rock');">
            Rock
        </button>

        <button onclick="playGame('paper');">
            Paper
        </button>

        <button onclick="playGame('scissors');">
            Scissors
        </button>

        <p class="js-move"></p>
        <p class="js-result"></p>
        <p class="js-score"></p>

        <button onclick = "
            score.wins = 0;
            score.loses = 0;
            score.ties = 0;
            localStorage.setItem('score', JSON.stringify(score));
            updateScoreElement();
        ">Reset Score</button>

        <script>
            const score = JSON.parse(localStorage.getItem('score')) || {
                wins: 0,
                loses: 0,
                ties: 0
            };

            updateScoreElement();

            function playGame(playerMove){
                const computerMove = pickComputerMove();
                let result = "";

                if(playerMove === 'scissors'){
                if(computerMove === 'rock'){
                    result = 'You lose';
                } else if(computerMove === 'paper'){
                    result = 'You win';
                } else if(computerMove === 'scissors'){
                    result = 'Tie';
                }

                } else if(playerMove === 'paper'){
                    if(computerMove === 'rock'){
                        result = 'You win';
                    } else if(computerMove === 'paper'){
                        result = 'Tie';
                    } else if(computerMove === 'scissors'){
                        result = 'You lose';
                    }
                
                } else if(playerMove === 'rock'){
                    if(computerMove === 'rock'){
                        result = 'Tie';
                    } else if(computerMove === 'paper'){
                        result = 'You lose';
                    } else if(computerMove === 'scissors'){
                        result = 'You win';
                    }
                }

                if(result === 'You win'){
                    score.wins += 1;
                } else if (result === 'You lose'){
                    score.loses += 1;
                } else if (result === 'Tie'){
                    score.ties += 1;
                }

                localStorage.setItem('score',JSON.stringify(score));
                updateResultElement(result);
                updateMoveElement(playerMove, computerMove);
                updateScoreElement();
            }

            function updateResultElement(result){
                const gameResult = document.querySelector('.js-result');
                gameResult.innerHTML = result;
            }

            function updateMoveElement(playerMove,computerMove){
                const moveResult = document.querySelector('.js-move');
                moveResult.innerHTML = `You ${playerMove} - ${computerMove} Computer`;
            }

            function updateScoreElement(){
                document.querySelector('.js-score')
                    .innerHTML = `Wins: ${score.wins}, Loses: ${score.loses}, Ties: ${score.ties}`;
            }

            function pickComputerMove(){
                const randomNumber = Math.random();

                let computerMove = '';

                if(randomNumber >=0 && randomNumber < 1/3){
                    computerMove = 'rock';
                } else if (randomNumber >=1/3 && randomNumber < 2/3){
                    computerMove = 'paper';
                } else if (randomNumber >=2/3 && randomNumber < 1){
                    computerMove = 'scissors'
                }

                return computerMove;
            }
        </script>
    </body>
</html>
